name: Probe Commodity Sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run probe script
        env:
          ALLTICK_TOKEN: ${{ secrets.ALLTICK_TOKEN }}
        run: python scripts/probe_sources.py

      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/probes/
          git diff --staged --quiet || git commit -m "chore: update commodity source probes"
          git push